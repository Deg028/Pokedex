<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex Web</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="background-pokemon" aria-hidden="true"></div>
    <div class="background-pokemon-left" aria-hidden="true"></div>

    <button
      id="theme-toggle"
      class="btn theme-toggle d-flex align-items-center gap-2 position-absolute top-0 end-0 m-3"
      type="button"
      aria-label="Cambiar tema"
    >
      <span class="theme-icon" aria-hidden="true">
        <img src="sprites/Charmander.png" alt="" />
      </span>
      <span class="theme-label small">Modo oscuro</span>
    </button>

    <main class="container-fluid min-vh-100 position-relative z-1 py-4">
      <div class="row g-4 justify-content-center mb-3">
        <!-- Buscador estilo Pokédex (barra horizontal superior) -->
        <div class="col-12 d-flex justify-content-center">
          <div class="pokedex-device pokedex-search shadow-lg sticky-lg-top">
            <!-- Panel superior decorativo estilo Pokédex -->
            <div class="pokedex-top">
              <div class="pokedex-lens" aria-hidden="true"></div>
              <div class="pokedex-lights" aria-hidden="true">
                <span class="light light-red"></span>
                <span class="light light-yellow"></span>
                <span class="light light-green"></span>
              </div>
            </div>

            <!-- Pantalla de la Pokédex -->
            <div class="pokedex-screen text-center">
              <h1 class="pokedex-title mb-4 h3">Pokédex</h1>

              <div class="row g-2 mb-2 align-items-stretch">
                <div class="col-12">
                  <div class="input-group">
                    <span class="input-group-text" aria-hidden="true">🔍</span>
                    <input
                      type="text"
                      id="pokemon-input"
                      class="form-control text-center"
                      placeholder="Busca por nombre o número..."
                    />
                  </div>
                </div>
                <div class="col-12 col-md-8">
                  <div class="dropdown">
                    <button
                      id="generation-filter"
                      type="button"
                      class="btn btn-light dropdown-toggle w-100"
                      data-bs-toggle="dropdown"
                      data-bs-display="static"
                      aria-expanded="false"
                      data-value=""
                    >
                      Todas las gens
                    </button>
                    <ul
                      class="dropdown-menu w-100 text-center"
                      aria-labelledby="generation-filter"
                    >
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option active"
                          data-value=""
                        >
                          Todas las gens
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="1"
                        >
                          Gen I
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="2"
                        >
                          Gen II
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="3"
                        >
                          Gen III
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="4"
                        >
                          Gen IV
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="5"
                        >
                          Gen V
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="6"
                        >
                          Gen VI
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="7"
                        >
                          Gen VII
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="8"
                        >
                          Gen VIII
                        </button>
                      </li>
                      <li>
                        <button
                          type="button"
                          class="dropdown-item gen-option"
                          data-value="9"
                        >
                          Gen IX
                        </button>
                      </li>
                    </ul>
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <button
                    id="search-btn"
                    type="button"
                    class="btn btn-danger w-100 fw-bold"
                  >
                    Buscar
                  </button>
                </div>
              </div>

              <p
                id="error-message"
                class="text-danger fw-bold mt-3 small hidden"
              >
                Pokémon no encontrado o no pertenece a la generación.
              </p>
            </div>
          </div>
      </div>

        <section class="grid" id="pokemon-grid" aria-live="polite"></section>

        <div class="loader" id="loader" hidden>
          <div class="spinner"></div><span>Cargando Pokémon...</span>
        </div>
        <div class="empty" id="empty" hidden>No se encontraron resultados.</div>
    </main>

    <div id="sentinel"></div>

    <!-- Modal -->
    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <div class="modal__panel" role="dialog" aria-modal="true">
        <button class="modal__close" data-close aria-label="Cerrar">&times;</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
