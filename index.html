<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-pokemon" aria-hidden="true"></div>
    <div class="background-pokemon-left" aria-hidden="true"></div>

    <button id="theme-toggle" class="btn theme-toggle d-flex align-items-center gap-2 position-absolute top-0 end-0 m-3" type="button" aria-label="Cambiar tema">
        <span class="theme-icon" aria-hidden="true">
            <img src="sprites/Charmander.png" alt="">
        </span>
        <span class="theme-label small">Modo oscuro</span>
    </button>

    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center position-relative z-1 py-5">
        
        <div class="card pokedex-container p-4 shadow-lg border-0 text-center w-100" style="max-width: 480px;">
            <h1 class="text-danger mb-4 h3">Pokédex</h1>
            
            <div class="row g-2 mb-4">
                <div class="col-12">
                    <input type="text" id="pokemon-input" class="form-control text-center" placeholder="Busca por nombre o número...">
                </div>
                <div class="col-7">
                    <select id="generation-filter" class="form-select text-center">
                        <option value="">Todas las gens</option>
                        <option value="1">Gen I</option>
                        <option value="2">Gen II</option>
                        <option value="3">Gen III</option>
                        <option value="4">Gen IV</option>
                        <option value="5">Gen V</option>
                        <option value="6">Gen VI</option>
                        <option value="7">Gen VII</option>
                        <option value="8">Gen VIII</option>
                        <option value="9">Gen IX</option>
                    </select>
                </div>
                <div class="col-5">
                    <button id="search-btn" class="btn btn-danger w-100 fw-bold">Buscar</button>
                </div>
            </div>

            <div id="pokemon-card" class="card pokemon-card border-0 p-3 hidden">
                <div class="image-container mx-auto rounded-circle d-flex align-items-center justify-content-center shadow-sm mb-3">
                    <img id="pokemon-img" class="img-fluid" src="" alt="Pokémon">
                </div>
                
                <h2 id="pokemon-name" class="text-capitalize h4 my-2"></h2>
                <p id="pokemon-generation" class="small text-muted mb-3"></p>
                
                <div id="pokemon-types" class="d-flex justify-content-center gap-2 mb-3"></div>
                
                <div class="row g-0 stats-container rounded p-2 bg-white shadow-sm text-secondary small">
                    <div class="col-6 border-end">
                        <p class="m-0"><strong>Altura</strong></p>
                        <p class="m-0"><span id="pokemon-height"></span> m</p>
                    </div>
                    <div class="col-6">
                        <p class="m-0"><strong>Peso</strong></p>
                        <p class="m-0"><span id="pokemon-weight"></span> kg</p>
                    </div>
                </div>
            </div>

            <p id="error-message" class="text-danger fw-bold mt-3 small hidden">Pokémon no encontrado o no pertenece a la generación.</p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
