<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex Web</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="background-pokemon" aria-hidden="true"></div>
    <div class="background-pokemon-left" aria-hidden="true"></div>

    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="Cambiar tema"
    >
      <span class="theme-icon" aria-hidden="true">
        <img src="sprites/Charmander.png" alt="" />
      </span>
      <span class="theme-label">Modo oscuro</span>
    </button>

    <main class="pokedex-container">
      <h1>Pokédex</h1>

      <div class="search-bar">
        <input
          type="text"
          id="pokemon-input"
          placeholder="Busca por nombre o número..."
        />
        <select id="generation-filter">
          <option value="">Todas las generaciones</option>
          <option value="1">Gen I</option>
          <option value="2">Gen II</option>
          <option value="3">Gen III</option>
          <option value="4">Gen IV</option>
          <option value="5">Gen V</option>
          <option value="6">Gen VI</option>
          <option value="7">Gen VII</option>
          <option value="8">Gen VIII</option>
          <option value="9">Gen IX</option>
        </select>
        <button id="search-btn">Buscar</button>
      </div>

      <div id="pokemon-card" class="pokemon-card hidden">
        <div class="image-container">
          <img id="pokemon-img" src="" alt="Pokémon" />
        </div>
        <h2 id="pokemon-name"></h2>
        <p id="pokemon-generation" class="generation-info"></p>
        <div id="pokemon-types" class="types"></div>
        <div class="stats">
          <p><strong>Altura:</strong> <span id="pokemon-height"></span>m</p>
          <p><strong>Peso:</strong> <span id="pokemon-weight"></span>kg</p>
        </div>
      </div>

      <p id="error-message" class="error hidden">
        Pokémon no encontrado. Intenta de nuevo.
      </p>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
